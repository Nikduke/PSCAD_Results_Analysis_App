[project]
name = "pscad-results-analysis-app"
version = "0.1.0"
description = "Native UI for organizing PSCAD simulation result analysis workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "PySide6-Essentials>=6.8",
    "python-docx>=1.1",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
packaging = [
    "pyinstaller>=6.11",
]

[project.scripts]
pscad-results-analysis = "results_analysis_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/results_analysis_app", "src/pscad_plotter_app_v3"]

[tool.hatch.build.targets.wheel.force-include]
"src/results_analysis_app/assets" = "results_analysis_app/assets"

[tool.hatch.build.targets.sdist]
include = [
    "src/results_analysis_app/assets/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
